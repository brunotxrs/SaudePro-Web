<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaúdePro - Portal do Paciente</title>
    <link rel="shortcut icon" href="./src/assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/index.css">
</head>
<body>
    <main class="main-login">
        <section class="container-login">

            <a href="./index.html" title="SaúdePro"><img src="./src/assets/img/saude-pro-logo.png" alt="Logo SaúdePro"></a>

            <form action="" method="POST" novalidate id="form-login" onsubmit="return false">
                
                <label for="login-cpf" id="item-login-user" title="Digite seu CPF" class="outline-mouse-out">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="cpf" id="login-cpf" placeholder="Digite seu CPF" required>
                </label>
                <span class="item-msg-aviso"></span>


                <label for="login-password" id="item-password-user" title="Digite sua senha" class="outline-mouse-out">
                    <i class="fa-solid fa-lock"  id="lock"></i>
                    <input type="password" name="password"  placeholder="Digite sua senha" id="login-password" required>
                    <i class="fa-solid fa-eye-slash" id="ico-eye"></i>
                </label>
                <span class="item-msg-aviso"></span>

                <button type="submit" id="btn-login" class="background-linear-gradient-buttons" title="Entrar">Entrar</button>
            </form>
            <p>Esqueceu a senha? <span id="click-here">clique aqui.</span></p>
        </section>

        <section class="container-recover-new-password hidden">
            <a href="./index.html" title="SaúdePro"><img src="./src/assets/img/saude-pro-logo.png" alt="Logo SaúdePro"></a>

            <h2>Recuperar Senha</h2>
            <form action="" method="POST" novalidate id="form-recover" onsubmit="return false">
                
                <label for="recover-cpf" id="item-recover-cpf" title="Digite seu CPF" class="outline-mouse-out">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="cpf" id="recover-cpf" placeholder="Digite seu CPF" required>
                    
                </label>
                <span class="item-msg-aviso"></span>
                <button type="submit" id="btn-recover" class="background-linear-gradient-buttons" title="Recuperar">
                    Enviar
                </button>
            </form>
        </section>
    </main>


    <span class="loader hidden"></span>

    <!-- Importando a biblioteca QRCode.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- 1. jQuery (obrigatório) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- 2. Inputmask (a versão 5.x é a mais moderna) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.8/jquery.inputmask.min.js"></script>

    <script src="https://cloudflare.com"></script>


    <script type="module" src="./src/js/index.js"></script>

</body>
</html>
